name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: log redact rules
        run: python3 test/test_log_redact.py

  ui:
    name: UI build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run build

  gateway:
    name: Gateway smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Gateway smoke (lite — skip data-plane preflight)
        env:
          GATEWAY_STORAGE: memory
          GATEWAY_AUTH_MODE: both
          OAUTH2_JWT_SECRET: oauth2-dev-secret
        run: ./scripts/ci-smoke-lite.sh
      - if: always()
        run: ./scripts/ci-stack-down.sh