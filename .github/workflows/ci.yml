name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: log redact rules
        run: python3 test/test_log_redact.py

  ui:
    name: UI build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run build

  gateway:
    name: Gateway smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Build and start gateway (memory)
        run: |
          export GATEWAY_STORAGE=memory
          export GATEWAY_AUTH_MODE=both
          export OAUTH2_JWT_SECRET=oauth2-dev-secret
          export GATEWAY_UPSTREAM_PEERS=mock-upstream:80
          export GATEWAY_UPSTREAM_SCHEME=http
          export GATEWAY_UPSTREAM_HOST=mock-upstream
          export GATEWAY_UPSTREAM_HEALTH_PATH=/status/200
          export GATEWAY_UPSTREAM_HEALTH_INTERVAL=60
          docker compose build openresty
          docker compose --profile ci up -d mock-upstream openresty
      - name: Wait for gateway
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "gateway did not become healthy" >&2
          docker logs gw-openresty || true
          exit 1
      - name: Python smoke tests
        env:
          GATEWAY_AUTH_MODE: both
          OAUTH2_JWT_SECRET: oauth2-dev-secret
        run: |
          python3 test/test.py
          python3 test/test_hmac.py
          python3 test/test_oauth2.py
          python3 test/test_metrics.py
      - if: always()
        run: docker compose --profile ci down -v || true