name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: log redact rules
        run: python3 test/test_log_redact.py

  ui:
    name: UI build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run build

  gateway:
    name: Gateway smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Build and start gateway (memory + mock upstream)
        env:
          GATEWAY_STORAGE: memory
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml build openresty
          docker compose -f docker-compose.yml -f docker-compose.ci.yml --profile ci up -d --force-recreate mock-upstream openresty
      - name: Wait for gateway and verify upstream env
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/health >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -sf http://127.0.0.1:8080/health >/dev/null || {
            echo "gateway did not become healthy" >&2
            docker logs gw-openresty || true
            exit 1
          }
          docker exec gw-openresty printenv GATEWAY_UPSTREAM_PEERS
          docker exec gw-openresty printenv GATEWAY_UPSTREAM_SCHEME
          test "$(docker exec gw-openresty printenv GATEWAY_UPSTREAM_PEERS)" = "mock-upstream:80"
          test "$(docker exec gw-openresty printenv GATEWAY_UPSTREAM_SCHEME)" = "http"
          docker exec gw-openresty sh -ce '
            if command -v wget >/dev/null; then
              wget -q -O - http://mock-upstream/status/200
            elif command -v curl >/dev/null; then
              curl -sf http://mock-upstream/status/200
            else
              echo "no wget/curl in openresty image" >&2
              exit 1
            fi
          '
      - name: Data plane preflight (api key → mock upstream)
        run: |
          curl -sf -H "X-Api-Key: mini-key" http://127.0.0.1:8080/ | head -c 200
          echo
      - name: Python smoke tests
        env:
          GATEWAY_AUTH_MODE: both
          OAUTH2_JWT_SECRET: oauth2-dev-secret
        run: |
          python3 test/test.py
          python3 test/test_hmac.py
          python3 test/test_oauth2.py
          python3 test/test_metrics.py
      - if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml --profile ci down -v || true