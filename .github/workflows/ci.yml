name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: log redact rules
        run: python3 test/test_log_redact.py

  ui:
    name: UI build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run build

  gateway:
    name: Gateway smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Stack up (mock upstream, no external httpbin)
        env:
          GATEWAY_STORAGE: memory
        run: ./scripts/ci-stack-up.sh
      - name: Python smoke tests
        env:
          GATEWAY_AUTH_MODE: both
          OAUTH2_JWT_SECRET: oauth2-dev-secret
        run: |
          python3 test/test.py
          python3 test/test_hmac.py
          python3 test/test_oauth2.py
          python3 test/test_metrics.py
      - if: always()
        run: ./scripts/ci-stack-down.sh