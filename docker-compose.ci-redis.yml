# CI overlay: storage=redis (dedicated ci-redis service — not the profiled `redis` service).
services:
  ci-redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    pull_policy: if_not_present
    container_name: gw-ci-redis
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  openresty:
    depends_on:
      ci-redis:
        condition: service_healthy
      mock-upstream:
        condition: service_healthy
    environment:
      GATEWAY_STORAGE: redis
      GATEWAY_REDIS_HOST: ci-redis
      GATEWAY_REDIS_PORT: "6379"