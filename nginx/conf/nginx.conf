
worker_processes  auto;
error_log  logs/error.log info;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    lua_package_path "/usr/local/openresty/nginx/lua/?.lua;;";

    # 共享内存（这里我们限流计数器放Redis，shared_dict可选备用）
    lua_shared_dict my_cache 10m;

    # 超时控制，cosocket
    lua_socket_connect_timeout 500ms;
    lua_socket_send_timeout 500ms;
    lua_socket_read_timeout 500ms;

    server {
        listen 8080;
        resolver 127.0.0.11 valid=10s ipv6=off;

        # set 只能在 server / location / if 内，不能写在 http 块
        set $ctx_request_id "";

        location / {
            # 增加requestId
            rewrite_by_lua_file /usr/local/openresty/nginx/lua/request_id.lua;
            # access阶段执行鉴权、限流
            access_by_lua_file /usr/local/openresty/nginx/lua/access_check.lua;
            # 日志
            log_by_lua_file    /usr/local/openresty/nginx/lua/log_access.lua;

            # 鉴权通过，转发到上游；这里上游我们直接用httpbin做测试后端
            proxy_pass https://httpbin.org/get;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # 透传 request id 给上游
            proxy_set_header X-Request-Id $ctx_request_id;
        }
    }
}
