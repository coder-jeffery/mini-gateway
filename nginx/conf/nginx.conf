
worker_processes  auto;
error_log  logs/error.log info;

env GATEWAY_STORAGE;
env GATEWAY_SQLITE_PATH;
env GATEWAY_REDIS_HOST;
env GATEWAY_REDIS_PORT;
env ADMIN_WHITELIST_IPS;
env DEFAULT_API_KEY;
env DEFAULT_API_KEY_LIMIT;
env DEFAULT_API_KEY_WINDOW;
env DEFAULT_ADMIN_TOKEN;
env GATEWAY_ADMIN_TRUST_PRIVATE;
env GATEWAY_AUTH_MODE;
env OAUTH2_ISSUER;
env OAUTH2_JWKS_URI;
env OAUTH2_AUDIENCE;
env OAUTH2_REQUIRED_SCOPE;
env OAUTH2_JWT_SECRET;
env OAUTH2_CLOCK_SKEW_SEC;
env OAUTH2_JWKS_CACHE_TTL;
env OAUTH2_RATE_LIMIT_KEY;
env OAUTH2_DEFAULT_LIMIT;
env OAUTH2_DEFAULT_WINDOW;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    lua_package_path "/usr/local/openresty/nginx/lua/?.lua;;";

    lua_shared_dict gateway_store 32m;
    lua_shared_dict gateway_logs 10m;
    lua_shared_dict oauth_jwks_cache 4m;

    lua_socket_connect_timeout 500ms;
    lua_socket_send_timeout 500ms;
    lua_socket_read_timeout 500ms;

    init_worker_by_lua_file /usr/local/openresty/nginx/lua/bootstrap_worker.lua;

    server {
        listen 8080;
        # listen 443 ssl;
        # http2 on;          # http2
        resolver 127.0.0.11 valid=10s ipv6=off;

        # ssl_certificate     /ssl/fullchain.pem;
        # ssl_certificate_key /ssl/privkey.pem;

        # # TLS 收紧（h2 不接受老旧 TLS）
        # ssl_protocols TLSv1.2 TLSv1.3;
        # ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        # ssl_prefer_server_ciphers off;
        # ssl_session_cache shared:SSL:10m;

        # # http2 调优（可选）
        # http2_max_field_size 16k;
        # http2_max_header_size 32k;
        # http2_max_concurrent_streams 128;

        set $ctx_request_id "";

        location = /health {
            content_by_lua_file /usr/local/openresty/nginx/lua/health.lua;
        }

        location = /ready {
            content_by_lua_file /usr/local/openresty/nginx/lua/ready.lua;
        }

        location /admin/gw {
            content_by_lua_file /usr/local/openresty/nginx/lua/admin_api.lua;
        }

        location /admin/gw/v1 {
            content_by_lua_file /usr/local/openresty/nginx/lua/admin_api_v1.lua;
        }

        location / {
            rewrite_by_lua_file /usr/local/openresty/nginx/lua/request_id.lua;
            access_by_lua_file /usr/local/openresty/nginx/lua/access_check.lua;
            log_by_lua_file    /usr/local/openresty/nginx/lua/log_access.lua;

            proxy_pass https://httpbin.org/get;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Request-Id $ctx_request_id;
        }
    }
}
