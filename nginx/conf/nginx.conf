
worker_processes  auto;
error_log  logs/error.log info;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    lua_package_path "/usr/local/openresty/nginx/lua/?.lua;;";

    # Shared dict (optional local cache; counters live in Redis)
    lua_shared_dict my_cache 10m;

    # Cosocket timeouts
    lua_socket_connect_timeout 500ms;
    lua_socket_send_timeout 500ms;
    lua_socket_read_timeout 500ms;

    server {
        listen 8080;
        resolver 127.0.0.11 valid=10s ipv6=off;

        # set is allowed only in server / location / if, not in http {}
        set $ctx_request_id "";

        # Admin API
        location /admin/gw {
            content_by_lua_file /usr/local/openresty/nginx/lua/admin_api.lua;
        }

        location / {
            # Assign X-Request-Id
            rewrite_by_lua_file /usr/local/openresty/nginx/lua/request_id.lua;
            # Auth and rate limit (access phase)
            access_by_lua_file /usr/local/openresty/nginx/lua/access_check.lua;
            # Access logging
            log_by_lua_file    /usr/local/openresty/nginx/lua/log_access.lua;

            # Upstream test backend (httpbin)
            proxy_pass https://httpbin.org/get;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # Forward request id to upstream
            proxy_set_header X-Request-Id $ctx_request_id;
        }   
    }
}
