version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: gw-redis
    ports:
      - "6379:6379"
    volumes:
      - ./redis/redis.conf:/etc/redis/redis.conf
    command: redis-server /etc/redis/redis.conf
    restart: always

  # Seed default admin IP whitelist on compose up (SADD is idempotent)
  redis-init:
    image: redis:7-alpine
    depends_on:
      - redis
    environment:
      ADMIN_WHITELIST_IPS: ${ADMIN_WHITELIST_IPS:-127.0.0.1,172.17.0.1,192.168.65.1}
    volumes:
      - ./redis/init-admin-whitelist.sh:/init-admin-whitelist.sh:ro
    entrypoint: ["/bin/sh", "/init-admin-whitelist.sh"]
    restart: "no"

  openresty:
    image: openresty/openresty:alpine-fat
    container_name: gw-openresty
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/conf/nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
      - ./nginx/lua:/usr/local/openresty/nginx/lua:ro
    depends_on:
      redis:
        condition: service_started
      redis-init:
        condition: service_completed_successfully
    restart: always
