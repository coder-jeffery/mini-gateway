services:
  redis:
    profiles: ["redis"]
    image: ${REDIS_IMAGE:-redis:7-alpine}
    pull_policy: if_not_present
    container_name: gw-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ./redis/redis.conf:/etc/redis/redis.conf
    command: redis-server /etc/redis/redis.conf
    restart: always

  redis-init:
    profiles: ["redis"]
    image: ${REDIS_IMAGE:-redis:7-alpine}
    pull_policy: if_not_present
    depends_on:
      - redis
    environment:
      ADMIN_WHITELIST_IPS: ${ADMIN_WHITELIST_IPS:-127.0.0.1,172.17.0.1,192.168.65.1}
      DEFAULT_API_KEY: ${DEFAULT_API_KEY:-mini-key}
      DEFAULT_API_KEY_LIMIT: ${DEFAULT_API_KEY_LIMIT:-1000}
      DEFAULT_API_KEY_WINDOW: ${DEFAULT_API_KEY_WINDOW:-60}
      DEFAULT_ADMIN_TOKEN: ${DEFAULT_ADMIN_TOKEN:-mini-token}
    volumes:
      - ./redis/bootstrap-gateway.sh:/bootstrap-gateway.sh:ro
    entrypoint: ["/bin/sh", "/bootstrap-gateway.sh"]
    restart: "no"

  openresty:
    build:
      context: .
      dockerfile: Dockerfile
    image: gw-openresty:local
    container_name: gw-openresty
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      GATEWAY_STORAGE: ${GATEWAY_STORAGE:-memory}
      GATEWAY_SQLITE_PATH: ${GATEWAY_SQLITE_PATH:-/var/lib/gateway/gateway.db}
      GATEWAY_REDIS_HOST: ${GATEWAY_REDIS_HOST:-redis}
      GATEWAY_REDIS_PORT: ${GATEWAY_REDIS_PORT:-6379}
      GATEWAY_ADMIN_TRUST_PRIVATE: ${GATEWAY_ADMIN_TRUST_PRIVATE:-1}
      ADMIN_WHITELIST_IPS: ${ADMIN_WHITELIST_IPS:-127.0.0.1,172.17.0.1,192.168.65.1}
      DEFAULT_API_KEY: ${DEFAULT_API_KEY:-mini-key}
      DEFAULT_API_KEY_LIMIT: ${DEFAULT_API_KEY_LIMIT:-1000}
      DEFAULT_API_KEY_WINDOW: ${DEFAULT_API_KEY_WINDOW:-60}
      DEFAULT_ADMIN_TOKEN: ${DEFAULT_ADMIN_TOKEN:-mini-token}
      GATEWAY_AUTH_MODE: ${GATEWAY_AUTH_MODE:-api_key}
      OAUTH2_ISSUER: ${OAUTH2_ISSUER:-}
      OAUTH2_JWKS_URI: ${OAUTH2_JWKS_URI:-}
      OAUTH2_AUDIENCE: ${OAUTH2_AUDIENCE:-}
      OAUTH2_REQUIRED_SCOPE: ${OAUTH2_REQUIRED_SCOPE:-}
      OAUTH2_JWT_SECRET: ${OAUTH2_JWT_SECRET:-}
      OAUTH2_CLOCK_SKEW_SEC: ${OAUTH2_CLOCK_SKEW_SEC:-60}
      OAUTH2_JWKS_CACHE_TTL: ${OAUTH2_JWKS_CACHE_TTL:-300}
      OAUTH2_RATE_LIMIT_KEY: ${OAUTH2_RATE_LIMIT_KEY:-sub}
      OAUTH2_DEFAULT_LIMIT: ${OAUTH2_DEFAULT_LIMIT:-}
      OAUTH2_DEFAULT_WINDOW: ${OAUTH2_DEFAULT_WINDOW:-}
    volumes:
      - ./nginx/conf/nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
      - ./nginx/lua:/usr/local/openresty/nginx/lua:ro
      - ./data:/var/lib/gateway
    restart: always

  ui:
    profiles: ["ui"]
    build:
      context: ./ui
      dockerfile: Dockerfile
    image: gw-ui:local
    container_name: gw-ui
    depends_on:
      - openresty
    ports:
      - "${UI_PORT:-3000}:3000"
    environment:
      PORT: ${UI_PORT:-3000}
      HOSTNAME: 0.0.0.0
      GATEWAY_ADMIN_URL: ${GATEWAY_ADMIN_URL:-http://openresty:8080/admin/gw/v1}
      GATEWAY_ADMIN_SECRET: ${GATEWAY_ADMIN_SECRET:-admin-secret-2026}
    restart: always
